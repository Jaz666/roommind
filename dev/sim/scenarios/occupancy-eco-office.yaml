name: occupancy-eco-office
description: >
  Office with a motion sensor and no schedule (comfort around the clock), occupancy eco on
  with a 15 min delay. The room must sit at eco while nobody is in it, follow comfort once
  someone is, and ride out a 10 min absence without dropping to eco (#180).
refs: [180]
tags: [trv, presence]
start: 2026-01-12T00:00
duration: 3d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    buero:
      name: Büro
      floor_area_m2: 12
      exterior_wall_m2: 8
      initial: {temperature: 19.0}
      windows: [{orientation: E, area_m2: 1.5}]
      devices:
        - {entity_id: climate.buero_trv, profile: generic_trv}
        - {entity_id: climate.kessel, profile: generic_boiler}
      sensors:
        temperature: {entity_id: sensor.buero_temp}
        occupancy: {entity_id: binary_sensor.buero_praesenz}
people:
  - {id: ben, profile: home_office, rooms: {office: buero}}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
    compressor_groups:
      - {id: kessel, name: Kessel, members: [climate.buero_trv], master_entity: climate.kessel, min_run_minutes: 5, min_off_minutes: 5}
  rooms:
    buero:
      devices: [{entity_id: climate.buero_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.buero_temp
      occupancy_sensors: [binary_sensor.buero_praesenz]
      occupancy_eco_enabled: true
      occupancy_eco_delay: 15
      climate_mode: heat_only
      comfort_temp: 21.0
      eco_temp: 17.0
timeline:
  - {at: "+1d11h", do: occupancy.set, room: buero, count: 0, for: 10m}
expect:
  - {invariant: no_rejected_commands}
  - {invariant: target_never_empty}
  - {check: "room.buero.occupancy_vacant == true and room.buero.target_temp == 17.0", at: "+0d03h", label: empty at night -> eco}
  - {check: "room.buero.occupancy_vacant == false and room.buero.target_temp == 21.0", at: "+0d10h", label: occupied -> comfort}
  - {check: "room.buero.target_temp == 21.0", at: "+1d11h09m", label: short absence bridged by the delay}
  - {check: "room.buero.occupancy_vacant == true and room.buero.target_temp == 17.0", at: "+1d18h", label: after work -> eco}
