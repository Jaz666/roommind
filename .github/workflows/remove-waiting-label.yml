name: Remove waiting-for-feedback label on reply

on:
  issue_comment:
    types: [created]

jobs:
  remove-label:
    if: >
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(toJSON(github.event.issue.labels.*.name), 'waiting for feedback')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // A reply reopens the case: without dropping fix-released the next release would skip this issue.
            for (const name of ['waiting for feedback', 'fix-released']) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name
              }).catch(e => { if (e.status !== 404) throw e; });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-attention']
            });
