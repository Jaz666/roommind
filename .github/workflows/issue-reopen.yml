name: Issue Reopen

on:
  issues:
    types: [closed, reopened]
  issue_comment:
    types: [created]

jobs:
  post-reopen-hint:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment reopen hint
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const closer = context.payload.sender.login;
            const author = issue.user.login;
            const labels = issue.labels.map(l => l.name);

            if (closer === author) return;
            if (labels.includes('no-reopen')) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `@${author} This issue was closed. If you believe it should be reopened, just include \`/reopen\` in a comment and it will be reopened automatically.`
            });

  reopen-issue:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/reopen')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Reopen if requested by author
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const commenter = context.payload.sender.login;
            const author = issue.user.login;
            const labels = issue.labels.map(l => l.name);

            if (labels.includes('no-reopen')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `This issue has been marked as \`no-reopen\` by a maintainer and cannot be reopened via \`/reopen\`.`
              });
              return;
            }

            if (commenter !== author) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${commenter} Only the issue author can use \`/reopen\`.`
              });
              return;
            }

            if (issue.state === 'open') return;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'open'
            });

            // A reopen by GITHUB_TOKEN fires no `reopened` run, so reset the labels here too.
            for (const name of ['waiting for feedback', 'stale', 'fix-released']) {
              if (labels.includes(name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name
                });
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['needs-attention']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Reopened by issue author @${commenter}.`
            });

  reset-labels-on-reopen:
    # Without this the stale workflow closes a reopened issue again as resolved.
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Drop feedback labels
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            for (const name of ['waiting for feedback', 'stale', 'fix-released']) {
              if (labels.includes(name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name
                });
              }
            }
